services:
  postgres:
    image: postgres:16-alpine
    container_name: oneeye_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oneeye
      POSTGRES_PASSWORD: oneeye_pass
      POSTGRES_DB: oneeye_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneeye -d oneeye_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: oneeye_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://oneeye:oneeye_pass@postgres:5432/oneeye_db
      DEMO_MODE: "true"
      VIDEO_SOURCE: /app/videos/demo/factory_safety.mp4
      EVIDENCE_DIR: /app/evidence
    ports:
      - "8000:8000"
    volumes:
      - ./evidence:/app/evidence
      - ./videos:/app/videos

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    container_name: oneeye_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    ports:
      - "3000:3000"

volumes:
  pgdata:
